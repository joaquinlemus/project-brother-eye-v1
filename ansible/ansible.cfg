[defaults]
inventory            = inventories/lab.yml
roles_path           = roles
collections_path     = collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking    = False          ; lab: llaves SSH cambian al recrear nodos en EVE-NG
retry_files_enabled  = False
stdout_callback      = ansible.builtin.default
callbacks_enabled    = portal_events  ; callback_plugins/portal_events.py -> API del portal
forks                = 10
timeout              = 30
gathering            = explicit
interpreter_python   = auto_silent
filter_plugins       = filter_plugins
callback_plugins     = callback_plugins
inventory_plugins    = inventories/plugins

[inventory]
enable_plugins       = portal_inventory, ansible.builtin.yaml, ansible.builtin.ini

[persistent_connection]
connect_timeout      = 60
command_timeout      = 60
