ipv6 unicast-routing
!
router ospfv3 1
 router-id 10.254.0.7
 !
 address-family ipv6 unicast
  passive-interface Ethernet0/1
 exit-address-family
!
router ospf 1
 router-id 10.254.0.7
 passive-interface Ethernet0/1
!
interface Tunnel0
 ip ospf network broadcast
 ip ospf dead-interval 15
 ip ospf hello-interval 5
 ip ospf priority 0
 ip ospf 1 area 0
 ip ospf cost 10
 ospfv3 network broadcast
 ospfv3 hello-interval 5
 ospfv3 dead-interval 15
 ospfv3 priority 0
 ospfv3 cost 10
 ospfv3 1 ipv6 area 0
!
interface Tunnel1
 ip ospf network broadcast
 ip ospf dead-interval 15
 ip ospf hello-interval 5
 ip ospf priority 0
 ip ospf 1 area 0
 ip ospf cost 100
 ospfv3 network broadcast
 ospfv3 hello-interval 5
 ospfv3 dead-interval 15
 ospfv3 priority 0
 ospfv3 cost 100
 ospfv3 1 ipv6 area 0
!
interface Loopback0
 ip ospf 1 area 0
