router bgp 65000
 bgp router-id 10.254.0.7
 bgp log-neighbor-changes
 timers bgp 5 15
 neighbor 192.168.5.1 remote-as 65000
 neighbor 192.168.5.1 description R1
 neighbor 192.168.5.1 update-source Tunnel0
 neighbor 192.168.5.132 remote-as 65000
 neighbor 192.168.5.132 description R2
 neighbor 192.168.5.132 update-source Tunnel1
 address-family ipv4
  network 10.254.0.7 mask 255.255.255.255
  network 10.35.0.0 mask 255.255.255.0
  neighbor 192.168.5.1 activate
  neighbor 192.168.5.1 weight 200
  neighbor 192.168.5.132 activate
 exit-address-family
