interface Loopback0
 ip address 10.254.0.2 255.255.255.255
 ip ospf 1 area 0
!
interface Tunnel1
 ip address 192.168.5.132 255.255.255.128
 no ip redirects
 ip mtu 1400
 ip nhrp network-id 2
 ip nhrp redirect
 ip tcp adjust-mss 1360
 ip ospf network broadcast
 ip ospf dead-interval 15
 ip ospf hello-interval 5
 ip ospf priority 255
 ip ospf 1 area 0
 ipv6 address FE80::2 link-local
 ipv6 address FD00:5:1::2/64
 ipv6 nhrp network-id 2
 ipv6 nhrp redirect
 ospfv3 network broadcast
 ospfv3 hello-interval 5
 ospfv3 dead-interval 15
 ospfv3 priority 255
 ospfv3 1 ipv6 area 0
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel key 2
 tunnel vrf INET
 tunnel protection ipsec profile PROF-IPSEC
!
router ospfv3 1
 router-id 10.254.0.2
 !
 address-family ipv6 unicast
 exit-address-family
!
router ospf 1
 router-id 10.254.0.2
