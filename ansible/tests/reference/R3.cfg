ipv6 unicast-routing
!
vrf definition INET
 !
 address-family ipv4
 exit-address-family
!
crypto ikev2 proposal PROP-DMVPN
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy POL-DMVPN
 match fvrf INET
 proposal PROP-DMVPN
!
crypto ikev2 keyring KR-DMVPN
 peer ANY
  address 0.0.0.0 0.0.0.0
  pre-shared-key <PSK>
 !
!
crypto ikev2 profile PROF-DMVPN
 match fvrf INET
 match identity remote address 0.0.0.0
 authentication remote pre-share
 authentication local pre-share
 keyring local KR-DMVPN
!
crypto ikev2 dpd 10 3 periodic
!
crypto ipsec transform-set TS-DMVPN esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile PROF-IPSEC
 set transform-set TS-DMVPN
 set ikev2-profile PROF-DMVPN
!
interface Loopback0
 ip address 10.254.0.3 255.255.255.255
 ip ospf 1 area 0
!
interface Tunnel0
 ip address 192.168.5.3 255.255.255.128
 no ip redirects
 ip mtu 1400
 ip nhrp network-id 1
 ip nhrp nhs 192.168.5.1 nbma 172.16.0.1 multicast
 ip tcp adjust-mss 1360
 ip ospf network broadcast
 ip ospf dead-interval 15
 ip ospf hello-interval 5
 ip ospf priority 0
 ip ospf 1 area 0
 ip ospf cost 10
 ipv6 address FE80::3 link-local
 ipv6 address FD00:5::3/64
 ipv6 nhrp network-id 1
 ipv6 nhrp nhs FD00:5::1 nbma 172.16.0.1 multicast
 ospfv3 network broadcast
 ospfv3 hello-interval 5
 ospfv3 dead-interval 15
 ospfv3 priority 0
 ospfv3 cost 10
 ospfv3 1 ipv6 area 0
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel key 1
 tunnel vrf INET
 tunnel protection ipsec profile PROF-IPSEC shared
!
interface Tunnel1
 ip address 192.168.5.133 255.255.255.128
 no ip redirects
 ip mtu 1400
 ip nhrp network-id 2
 ip nhrp nhs 192.168.5.132 nbma 172.16.0.2 multicast
 ip tcp adjust-mss 1360
 ip ospf network broadcast
 ip ospf dead-interval 15
 ip ospf hello-interval 5
 ip ospf priority 0
 ip ospf 1 area 0
 ip ospf cost 100
 ipv6 address FE80::3 link-local
 ipv6 address FD00:5:1::3/64
 ipv6 nhrp network-id 2
 ipv6 nhrp nhs FD00:5:1::2 nbma 172.16.0.2 multicast
 ospfv3 network broadcast
 ospfv3 hello-interval 5
 ospfv3 dead-interval 15
 ospfv3 priority 0
 ospfv3 cost 100
 ospfv3 1 ipv6 area 0
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel key 2
 tunnel vrf INET
 tunnel protection ipsec profile PROF-IPSEC shared
!
interface Ethernet0/0
 vrf forwarding INET
 ip address 172.16.0.3 255.255.255.0
 duplex auto
!
interface Ethernet0/1
 ip address 10.31.0.1 255.255.255.0
 ip ospf 1 area 0
 duplex auto
 ipv6 address 2001:1228:3::1/64
 ospfv3 1 ipv6 area 0
!
router ospfv3 1
 router-id 10.254.0.3
 !
 address-family ipv6 unicast
  passive-interface Ethernet0/1
 exit-address-family
!
router ospf 1
 router-id 10.254.0.3
 passive-interface Ethernet0/1
!
ip access-list standard MGMT
 permit 172.16.0.20
!
line vty 0 4
 access-class MGMT in vrf-also
 login local
 transport input ssh
