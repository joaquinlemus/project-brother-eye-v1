---
# Ejemplo de archivo de sitio (el que generará el portal desde el IPAM).
# Valores reales de R3, útil para probar en modo --check sin cambiar nada.
# Uso: cp inventories/examples/site_R3.yml inventories/
all:
  children:
    spokes:
      hosts:
        R3:
          ansible_host: 172.16.0.3
          site_id: 3
          site_code: MAZ-03
          site_name: Mazate
          loopback0: 10.254.0.3
          lan_interfaces: [Ethernet0/1]
          lan_v4: 10.31.0.0/24
          lan_v6: "2001:1228:3::/64"
          tunnel1_v4: 192.168.5.3
          tunnel2_v4: 192.168.5.133
          tunnel1_v6: "fd00:5::3"
          tunnel2_v6: "fd00:5:1::3"
