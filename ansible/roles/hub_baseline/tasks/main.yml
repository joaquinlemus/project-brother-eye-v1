---
# Línea base de los hubs: los mismos roles comunes + el túnel de hub.
# Se ejecuta una vez (y después solo para cambios globales), nunca por cada sitio.
- name: Front-door VRF
  ansible.builtin.include_role:
    name: fvrf

- name: Configuración base
  ansible.builtin.include_role:
    name: base

- name: IPsec IKEv2
  ansible.builtin.include_role:
    name: crypto_ikev2

- name: Túnel mGRE del hub y OSPF
  cisco.ios.ios_config:
    src: hub_tunnel.j2
    match: line
  no_log: "{{ not (debug_secrets | default(false)) }}"

- name: SNMPv3
  ansible.builtin.include_role:
    name: snmpv3
