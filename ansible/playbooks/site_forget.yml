---
# Retiro de una sucursal que ya no responde (router apagado, borrado o desconectado).
# No se conecta al spoke: solo quita el host de Zabbix y limpia los hubs.
# Si el router vuelve a aparecer conserva su configuración: hay que borrarlo antes de reusarlo.
- name: Retiro sin conexión al spoke
  hosts: spokes
  gather_facts: false
  tasks:
    - name: Eliminar host de Zabbix
      ansible.builtin.include_role:
        name: zabbix_host
        apply: { tags: [zabbix] }
      vars: { zabbix_state: absent }
      tags: [zabbix]

    - name: Limpiar NHRP IPv4 del sitio en los hubs
      cisco.ios.ios_command:
        commands:
          - "clear ip nhrp {{ hostvars[inventory_hostname]['tunnel' ~ hub_item.id ~ '_v4'] }}"
      delegate_to: "{{ hub_item.hub.name }}"
      loop: "{{ dmvpn_clouds }}"
      loop_control: { loop_var: hub_item, label: "{{ hub_item.hub.name }}" }

    - name: Limpiar NHRP IPv6 del sitio en los hubs
      cisco.ios.ios_command:
        commands:
          - "clear ipv6 nhrp {{ hostvars[inventory_hostname]['tunnel' ~ hub_item.id ~ '_v6'] | upper }}/128"
      delegate_to: "{{ hub_item.hub.name }}"
      loop: "{{ dmvpn_clouds }}"
      loop_control: { loop_var: hub_item, label: "{{ hub_item.hub.name }}" }
      failed_when: false

- name: Verificar en los hubs que el sitio desapareció
  hosts: hubs
  gather_facts: false
  tasks:
    # Coincidencia exacta de la IP: con una búsqueda de texto simple, 192.168.5.13 (R13)
    # "aparece" dentro de 192.168.5.133 (R3) y la verificación falla aunque el sitio ya no esté.
    - name: Expresión con las IPs de túnel del sitio dado de baja
      ansible.builtin.set_fact:
        _gone_re: >-
          (^|[^0-9.])({{ (groups['spokes'] | map('extract', hostvars, 'tunnel1_v4') | list
                         + groups['spokes'] | map('extract', hostvars, 'tunnel2_v4') | list)
                         | map('regex_escape') | join('|') }})([^0-9]|$)

    - name: Consultar NHRP y OSPF
      cisco.ios.ios_command:
        commands:
          - show ip nhrp
          - show ip ospf neighbor
      register: _hub
      changed_when: false
      # El dead-interval de OSPF (15 s) y el registro NHRP pueden tardar en caer
      until: _hub.stdout | join('\n') is not search(_gone_re, multiline=True)
      retries: 6
      delay: 10

    - name: El spoke no debe aparecer
      ansible.builtin.assert:
        that:
          - _hub.stdout | join('\n') is not search(_gone_re, multiline=True)
        fail_msg: "El sitio {{ item }} sigue visible en {{ inventory_hostname }}"
      loop: "{{ groups['spokes'] }}"
      loop_control: { label: "{{ item }}" }
