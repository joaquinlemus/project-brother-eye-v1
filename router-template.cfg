configure terminal
hostname R<N>
no ip domain lookup
ip domain name lab.local
service timestamps debug datetime msec
service timestamps log datetime msec
!
vrf definition INET
 address-family ipv4
 exit-address-family
!
interface Ethernet0/0
 vrf forwarding INET
 ip address 172.16.0.<N> 255.255.255.0
 no shutdown
!
username ansible privilege 15 secret <PASSWORD>
!
ip ssh version 2
ip access-list standard MGMT
 permit 172.16.0.20
 deny   any log
!
line vty 0 4
 access-class MGMT in vrf-also
 login local
 transport input ssh
!
crypto key generate rsa general-keys modulus 2048
end
write memory